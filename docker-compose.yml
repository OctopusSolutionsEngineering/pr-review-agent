version: "3.9"

services:
  pr-review-agent:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  redis-data:
